{{- define "main" -}}
  <div class="prose lg:prose-lg xl:prose-xl mx-auto w-full py-8">
    <h1>{{ .Title }}</h1>

    {{- with .Description -}}
      <p>{{ . }}</p>
    {{- end -}}


    <ul>
      {{- range .Pages -}}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
            {{ .Date.Format "January 2, 2006" }}
          </time>
        </li>
      {{- end -}}
    </ul>
  </div>
{{- end -}}
