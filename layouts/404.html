{{- define "main" -}}
  <div class="flex min-h-[70vh] items-center justify-center px-4">
    <div class="mx-auto max-w-2xl text-center">
      <div class="mb-8">
        <h1 class="text-9xl font-bold text-gray-800">404</h1>
        <div class="mx-auto mt-4 h-1 w-20 bg-gray-600"></div>
      </div>

      <h2 class="mb-4 text-3xl font-bold text-gray-700">Page Not Found</h2>

      <p class="mb-8 text-lg text-gray-600">
        The page you are looking for does not exist or has been moved.
      </p>

      <div class="flex flex-col justify-center gap-4 sm:flex-row">
        <a
          href="{{ site.Home.RelPermalink }}"
          class="inline-flex items-center justify-center rounded-lg bg-gray-600 px-6 py-3 font-medium text-white transition-colors hover:bg-gray-950">
          <i data-lucide="home" class="mr-2 size-5"></i>
          Go Home
        </a>

        <button
          onclick="history.back()"
          class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-gray-800 px-6 py-3 font-medium text-gray-100 transition-colors hover:bg-gray-950">
          <i data-lucide="arrow-left" class="mr-2 size-5"></i>
          Go Back
        </button>
      </div>
    </div>
  </div>
{{- end -}}
