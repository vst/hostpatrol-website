{{ define "content" }}
  <main class="mx-auto flex w-full grow flex-col font-mono">
    <div class="relative isolate min-h-screen w-full overflow-hidden bg-white">
      <svg
        class="absolute inset-0 -z-10 h-full w-full [mask-image:radial-gradient(100%_100%_at_top_right,white,transparent)] stroke-gray-200"
        aria-hidden="true">
        <defs>
          <pattern
            id="0787a7c5-978c-4f66-83c7-11c213f99cb7"
            width="200"
            height="200"
            x="50%"
            y="-1"
            patternUnits="userSpaceOnUse">
            <path d="M.5 200V.5H200" fill="none"></path>
          </pattern>
        </defs>
        <rect
          width="100%"
          height="100%"
          stroke-width="0"
          fill="url(#0787a7c5-978c-4f66-83c7-11c213f99cb7)"></rect>
      </svg>
      <div
        class="mx-auto max-w-7xl px-6 pt-10 pb-24 sm:pb-32 lg:flex lg:px-8 lg:py-40">
        <div
          class="mx-auto max-w-2xl lg:mx-0 lg:max-w-xl lg:flex-shrink-0 lg:pt-8">
          <h1 class="hidden lg:block">
            <img
              src="{{ site.Params.media.logo.light }}"
              alt="Host Patrol Logo"
              class="h-5" />
            <span class="sr-only">{{ site.Title }}</span>
          </h1>
          <div class="mt-6 flex space-x-2">
            {{- range .Page.Params.badges -}}
              <a href="{{ .target }}" class="underline" title="{{ .title }}">
                <img alt="{{ .title }} Badge" src="{{ .source }}" />
              </a>
            {{- end -}}
          </div>
          <h2
            class="mt-10 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">
            <span class="block">{{ .Page.Params.subtitle }}</span>
          </h2>
          <p class="mt-6 text-lg leading-8 text-balance text-gray-600">
            {{ .Page.Params.description }}
          </p>
          <div class="mt-10 flex items-center gap-x-6">
            <a href="/quickstart" class="btn-cta">Quickstart</a>
            <a
              href="#learn-more"
              class="text-sm leading-6 font-semibold text-gray-900">
              Learn more <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>
        <div
          class="mx-auto mt-16 flex max-w-2xl sm:mt-24 lg:mt-0 lg:mr-0 lg:ml-10 lg:max-w-none lg:flex-none xl:ml-32">
          <div class="max-w-3xl flex-none sm:max-w-5xl lg:max-w-none">
            <div
              class="-m-2 rounded-xl bg-gray-900/5 p-2 ring-1 ring-gray-900/10 ring-inset lg:-m-4 lg:rounded-2xl lg:p-4">
              <img
                src="https://github.com/vst/hostpatrol/assets/374793/416e1135-fe9a-4998-8acc-de07dd62c88b"
                alt="Web UI Screenshot (with Mock Data)"
                width="1634"
                height="801"
                class="w-[76rem] rounded-md shadow-2xl ring-1 ring-gray-900/10" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="learn-more" class="space-y-16 py-24 sm:py-32">
      <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <dl
          class="mx-auto mt-16 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-16 text-base leading-7 sm:grid-cols-2 lg:mx-0 lg:max-w-none lg:grid-cols-3">
          {{- range .Page.Params.learn_more -}}
            <div>
              <dt class="font-semibold text-gray-900">{{ .title }}</dt>
              <dd
                class="prose prose-a:text-indigo-600 mt-1 text-balance text-gray-600">
                {{ .content | markdownify }}
              </dd>
            </div>
          {{- end -}}
        </dl>
      </div>

      <div class="mx-auto flex w-full max-w-2xl justify-center">
        <a href="/quickstart" class="btn-cta">Proceed to Quickstart</a>
      </div>
    </div>
  </main>
{{ end }}
